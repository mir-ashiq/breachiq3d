[project]
name = "breachiq3d"
version = "0.1.0"
description = "Spatio-temporal utility trajectory & site-execute engine for competitive VALORANT (Sky's The Limit 2026, Category 1)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "BreachIQ 3D contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "zstandard>=0.23",
    "pydantic>=2.9",
    "reportlab>=4.2",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["breachiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
